apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: cpsc-cloud-native
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
      - name: web
        image: ghcr.io/example/demo-web:v1
        ports:
        - containerPort: 8080
